    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 3840px; height: 2160px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      #cab { position: absolute; inset: 0; width: 3840px; height: 2160px; display: block; }
    </style>
  </head>
  <body>

      <audio id="chime2" class="clip" src="assets/audio/chime.wav" data-start="41.66" data-duration="1.28" data-track-index="2" data-volume="0.7"></audio>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
    <script>
      // The scene takes a moment to build (and the minimap image to decode):
      // tell the renderer to wait for it before asking for frames.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.cab = new Promise((resolve) => { window.__cabReady = resolve; });
    </script>
    <script type="module">
      import * as THREE from "./assets/vendor/three.module.js";
      import city from "./assets/city-wide.js";   // the wider city, for the closing shot (assets/city.js is the first, smaller one)
      import geo from "./assets/minimap-geo.js";
      import captions from "./assets/captions.js";
      import { createCabRide } from "./assets/cab-ride.js";
      import { GLTFLoader } from "./assets/vendor/addons/GLTFLoader.js";
      import { clone } from "./assets/vendor/addons/SkeletonUtils.js";
      const img = new Image();
      img.src = "assets/minimap.png";
      await img.decode();
      // The ride is drawn from timeline time alone (the hf-seek protocol).
      // the campaign's logos for the end credits (from buildthetunnelchicago.org)
      const logo = async (src) => { const i = new Image(); i.src = src; await i.decode(); return i; };
      const logos = { crosstowner: await logo("assets/logos/crosstowner.png"), starline: await logo("assets/logos/starline-chicago.png") };
      // the people: Quaternius's Universal Base Characters (CC0, assets/people), dressed and posed in cab-ride.js
      const gltf = new GLTFLoader(), tex = new THREE.TextureLoader();
      const skinTex = async (file) => { const t = await tex.loadAsync("assets/people/bodies/" + file); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; return t; };
      const HAIR = ["Hair_Buzzed", "Hair_SimpleParted", "Hair_Long", "Hair_Buns", "Hair_BuzzedFemale", "Hair_Beard"];
      const USE_HUMANS = false;                                   // off for now: too slow to render (see cab-ride.js, `humans`)
      const [male, female, maleSkin, femaleSkin, ...hairs] = !USE_HUMANS ? [] : await Promise.all([
        gltf.loadAsync("assets/people/bodies/Superhero_Male_FullBody.gltf"), gltf.loadAsync("assets/people/bodies/Superhero_Female_FullBody.gltf"),
        skinTex("T_Superhero_Male_Ligh.png"), skinTex("T_Superhero_Female_Light_BaseColor.png"),
        ...HAIR.map((h) => gltf.loadAsync(`assets/people/hair/${h}.gltf`))]);
      const humans = { male, female, skin: { male: maleSkin, female: femaleSkin }, hair: Object.fromEntries(HAIR.map((h, i) => [h, hairs[i]])), clone };
      const ride = createCabRide(THREE, city, document.getElementById("cab"), 3840, 2160, { img, geo }, logos, captions, USE_HUMANS ? humans : null);
      window.__cabRide = ride;
      window.addEventListener("hf-seek", (e) => ride.render(e.detail.time));
      ride.render(0);
      window.__cabReady();
    </script>
  </body>
</html>
