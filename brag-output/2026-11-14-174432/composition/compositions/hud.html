  <script>
    (function () {
      const root = document.getElementById("hud-wrap");
      const V = root.classList.contains("fmt-v");
      const TOT = "#tot-l";
      const fmt = n => Math.round(n).toLocaleString("en-US");
      const tl = gsap.timeline({ paused: true });
      const count = (el, to, at, dur) => {
        const o = { v: 0 };
        tl.fromTo(o, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, at);
      };

      // 1 · title: panel is there at frame 0; kicker and sub-line settle, then it leaves with the dive
      tl.fromTo("#title-kick", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.fromTo("#title-sub .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.07, ease: "power2.out" }, 0.35);
      tl.fromTo("#title-in", { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, 2.45);

      // 2 · notes
      [["#note1-in", 3.2, 2.5], ["#note2-in", 18.7, 1.9]].forEach(([s, at, d]) => {
        tl.fromTo(s, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, at);
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, at + d - 0.24);
      });
      tl.fromTo("#tag-in", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 4.6);
      tl.fromTo("#tag-in", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 19.6);

      // 3 · station cards — beat-grid: arrivals at 6.56, 9.83, 13.11 (strong cue), 16.38; cards lead by 0.45 s
      const JOBS = [11533, 24894, 37015, 29493], START = [6.11, 9.38, 12.66, 15.93];
      START.forEach((at, k) => {
        const id = "#st" + (k + 1);
        tl.fromTo(id + "-in", { opacity: 0, y: V ? 70 : 0, x: V ? 0 : -70 }, { opacity: 1, y: 0, x: 0, duration: 0.45, ease: "expo.out" }, at);
        tl.fromTo(id + "-in .pips i.new", { scale: 0.2 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.2);
        count(root.querySelector(id + "-jobs"), JOBS[k], at + 0.15, 0.85);
        tl.fromTo(id + "-in", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, at + 2.4 - 0.22);
      });

      // 4 · end card — stats on beats 21.28 / 21.84 / 22.37; total lands on 22.93 (beat-locked: strongest cue)
      tl.fromTo("#end-in", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 20.6);
      [21.28, 21.84, 22.37].forEach((at, k) => {
        tl.fromTo(TOT + " .t" + (k + 1), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, at);
      });
      count(root.querySelector(TOT + " .jobs-total"), 102935, 22.37, 0.56);

      window.__timelines["hud"] = tl;
    })();
  </script>
