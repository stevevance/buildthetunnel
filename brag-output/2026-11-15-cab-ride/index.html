    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
    <script>
      // The scene takes a moment to build (and the minimap image to decode):
      // tell the renderer to wait for it before asking for frames.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.cab = new Promise((resolve) => { window.__cabReady = resolve; });
    </script>
    <script type="module">
      import * as THREE from "./assets/vendor/three.module.js";
      import city from "./assets/city-wide.js";   // the wider city, for the closing shot (assets/city.js is the first, smaller one)
      import geo from "./assets/minimap-geo.js";
      import captions from "./assets/captions.js";
      import { createCabRide } from "./assets/cab-ride.js";
      const img = new Image();
      img.src = "assets/minimap.png";
      await img.decode();
      // The ride is drawn from timeline time alone (the hf-seek protocol).
      // the campaign's logos for the end credits (from buildthetunnelchicago.org)
      const logo = async (src) => { const i = new Image(); i.src = src; await i.decode(); return i; };
      const logos = { crosstowner: await logo("assets/logos/crosstowner.png"), starline: await logo("assets/logos/starline-chicago.png") };
      const ride = createCabRide(THREE, city, document.getElementById("cab"), 3840, 2160, { img, geo }, logos, captions);
      window.__cabRide = ride;
      window.addEventListener("hf-seek", (e) => ride.render(e.detail.time));
      ride.render(0);
      window.__cabReady();
    </script>
  </body>
</html>
