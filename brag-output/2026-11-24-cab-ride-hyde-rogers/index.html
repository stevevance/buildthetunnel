    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
    <script>
      // The scene takes a moment to build (and the minimap image to decode):
      // tell the renderer to wait for it before asking for frames.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.cab = new Promise((resolve) => { window.__cabReady = resolve; });
    </script>
    <script type="module">
      import * as THREE from "./assets/vendor/three.module.js";
      import cityWide from "./assets/city-wide.js";   // the wider city, for the closing shot (assets/city.js is the first, smaller one)
      import corridor from "./assets/city-corridor.js";   // and along this film's new track (tools/build-corridor.mjs)
      import intro from "./assets/city-intro.js";         // and what the opening looks over, south of 59th (tools/build-intro-area.mjs)
      const city = { ...cityWide };
      for (const k of ["buildings", "roads", "water", "parks"]) city[k] = cityWide[k].concat(corridor[k], intro[k]);
      Object.assign(city, { introArea: intro.area, paths: intro.paths, avenues: intro.avenues, rails: intro.rails, trees: intro.trees, woods: intro.woods });
      // and the buildings OpenStreetMap gets wrong, fixed by hand (assets/city-additions.js)
      import additions from "./assets/city-additions.js";
      {
        const inRing = (x, z, r) => { let k = false; for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) if ((r[i + 1] > z) !== (r[j + 1] > z) && x < (r[j] - r[i]) * (z - r[i + 1]) / (r[j + 1] - r[i + 1]) + r[i]) k = !k; return k; };
        const centre = (b) => { const xs = b.p.filter((_, i) => i % 2 === 0), zs = b.p.filter((_, i) => i % 2 === 1); return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...zs) + Math.max(...zs)) / 2]; };
        city.buildings = city.buildings.filter((b) => !additions.replace.some((r) => inRing(...centre(b), r))).concat(additions.buildings);
      }
      import geo from "./assets/minimap-geo.js";
      import captions from "./assets/captions.js";
      import { createCabRide } from "./assets/cab-ride.js";
      import { GLTFLoader } from "./assets/vendor/addons/GLTFLoader.js";
      import { clone } from "./assets/vendor/addons/SkeletonUtils.js";
      import art from "./assets/art.js";
      const img = new Image();
      img.src = "assets/minimap.png";
      await img.decode();
      // The ride is drawn from timeline time alone (the hf-seek protocol).
      // the campaign's logos for the end credits (from buildthetunnelchicago.org)
      const logo = async (src) => { const i = new Image(); i.src = src; await i.decode(); return i; };
      const logos = { crosstowner: await logo("assets/logos/crosstowner.png"), starline: await logo("assets/logos/starline-chicago.png") };
      // the people: Quaternius's Universal Base Characters (CC0, assets/people), dressed and posed in cab-ride.js
      const gltf = new GLTFLoader(), tex = new THREE.TextureLoader();
      const skinTex = async (file) => { const t = await tex.loadAsync("assets/people/bodies/" + file); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; return t; };
      const HAIR = ["Hair_Buzzed", "Hair_SimpleParted", "Hair_Long", "Hair_Buns", "Hair_BuzzedFemale", "Hair_Beard"];
      const USE_HUMANS = false;                                   // off for now: too slow to render (see cab-ride.js, `humans`)
      const [male, female, maleSkin, femaleSkin, ...hairs] = !USE_HUMANS ? [] : await Promise.all([
        gltf.loadAsync("assets/people/bodies/Superhero_Male_FullBody.gltf"), gltf.loadAsync("assets/people/bodies/Superhero_Female_FullBody.gltf"),
        skinTex("T_Superhero_Male_Ligh.png"), skinTex("T_Superhero_Female_Light_BaseColor.png"),
        ...HAIR.map((h) => gltf.loadAsync(`assets/people/hair/${h}.gltf`))]);
      const humans = { male, female, skin: { male: maleSkin, female: femaleSkin }, hair: Object.fromEntries(HAIR.map((h, i) => [h, hairs[i]])), clone };
      // the Art Institute of Chicago's paintings for the station walls (public domain)
      const artwork = await Promise.all(art.map(async (a) => { const i = new Image(); i.src = a.file; await i.decode(); return { ...a, img: i }; }));
      // ?size=WxH draws the film at another frame size without changing this file (tools/direct-render.mjs --size)
      // ?web draws the cut for the web page: no story cards, captions or minimap; or ?nocards, ?nominimap, ?nocaptions
      // one at a time (tools/direct-render.mjs --web, --no-cards, --no-minimap, --no-captions)
      const params = new URLSearchParams(location.search);
      const [W, H] = (params.get("size") || "3840x2160").split("x").map(Number);
      const off = (k) => (params.has("no" + k) ? false : undefined);
      const ride = createCabRide(THREE, city, document.getElementById("cab"), W, H, { img, geo }, logos, captions, USE_HUMANS ? humans : null, artwork,
        { web: params.has("web"), cards: off("cards"), minimap: off("minimap"), captions: off("captions") });
      window.__cabRide = ride;
      window.addEventListener("hf-seek", (e) => ride.render(e.detail.time));
      ride.render(0);
      window.__cabReady();
    </script>
