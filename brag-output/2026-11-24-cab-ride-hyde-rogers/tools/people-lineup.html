<!doctype html>
<html><head><meta charset="utf-8"><title>people lineup</title></head>
<body style="margin:0;background:#d9dde0">
<canvas id="c" width="2400" height="1100"></canvas>
<script type="module">
// The film's ten kinds of people (assets/people.js) in a row, for approving them without running the film: turned to
// face the camera, three-quarters, side-on and away; their faces, close; and each crowd kind in five variations
// (vary1, vary2).
// Driven by tools/people-lineup.mjs.
import * as THREE from "../assets/vendor/three.module.js";
import { peopleKit } from "../assets/people.js";

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const P = peopleKit({ THREE });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9dde0);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshBasicMaterial({ color: 0xb9bec2 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(30, 2400 / 1100, 0.05, 200);
// the row: each kind at its own x, the bike and wheelchair given more room
const ROW = [["commuter", 0], ["student", 1], ["nurse", 2], ["trades", 3], ["elder", 4], ["dress", 5], ["parent", 6], ["child", 6.75],
  ["cyclist", 8.3], ["wheelchair", 9.9]];
const build = (kind, k) => kind === "cyclist" ? P.withBike(k) : kind === "wheelchair" ? P.wheelchairUser(k) : P.person(kind, k);
window.lineup = (view, seed = 1) => {
  for (const o of [...scene.children]) if (o !== floor) scene.remove(o);
  if (view === "vary1" || view === "vary2") {             // three of the crowd's kinds, five variations of each
    (view === "vary1" ? ["commuter", "student", "nurse"] : ["trades", "elder", "dress"]).forEach((kind, r) => {
      for (let c = 0; c < 5; c++) { const g = P.person(kind, seed + c * 11 + r * 101 + (view === "vary2" ? 303 : 0)); g.position.set(c * 0.95 + r * 5.2, 0, 0); g.rotation.y = -0.35; scene.add(g); }
    });
    cam.fov = 22; cam.aspect = 2400 / 1100; cam.position.set(7.1, 1.25, 19); cam.lookAt(7.1, 0.85, 0); cam.updateProjectionMatrix();
    renderer.render(scene, cam); return renderer.domElement.toDataURL("image/png");
  }
  const turn = { front: 0, q: -Math.PI / 4, side: -Math.PI / 2, back: Math.PI, faces1: 0, faces2: 0 }[view];
  for (const [kind, x] of ROW) { const g = build(kind, seed + x * 7); g.position.x = x; g.rotation.y = turn; scene.add(g); }
  if (view === "faces1" || view === "faces2") {            // the heads of the first five, or the last five, close
    const x0 = view === "faces1" ? 2 : 7.4;
    cam.fov = 16; cam.position.set(x0, 1.45, 9.5); cam.lookAt(x0, 1.38, 0);
  } else { cam.fov = 30; cam.position.set(4.95, 1.25, 17.5); cam.lookAt(4.95, 0.85, 0); }
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL("image/png");
};
window.ready = true;
</script></body></html>
