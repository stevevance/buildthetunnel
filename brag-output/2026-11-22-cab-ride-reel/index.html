<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      #cab { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="59" data-width="1080" data-height="1920">
      <canvas id="cab" class="clip" data-start="0" data-duration="59" data-track-index="0" width="1080" height="1920"></canvas>
      <!-- audio:start: announcements (macOS voice Zoe) and chimes, placed by tools/place-audio.mjs -->
      <audio id="music" class="clip" src="assets/music/geoffpeters_-_Video_Movie_Game.mp3" data-start="0.00" data-duration="23.35" data-media-start="0.00" data-track-index="4" data-volume="0.6" data-fade-in="0.2" data-fade-out="2.2"></audio>
      <audio id="rumble-intro" class="clip" src="assets/audio/rumble.wav" data-start="0.00" data-duration="23.20" data-media-start="123.82" data-track-index="3" data-volume="0.25" data-fade-in="0.8" data-fade-out="0.9"></audio>
      <audio id="rumble" class="clip" src="assets/audio/rumble.wav" data-start="23.20" data-duration="35.29" data-media-start="72.87" data-track-index="3" data-volume="0.45" data-fade-in="0.9" data-fade-out="2"></audio>
      <audio id="prechime4" class="clip" src="assets/audio/prechime.wav" data-start="23.50" data-duration="2.20" data-media-start="0.00" data-track-index="2" data-volume="0.8"></audio>
      <audio id="next4" class="clip" src="assets/audio/next4.wav" data-start="25.20" data-duration="12.56" data-media-start="0.00" data-track-index="1" data-volume="1"></audio>
      <audio id="chime4" class="clip" src="assets/audio/chime.wav" data-start="38.49" data-duration="1.28" data-media-start="0.00" data-track-index="2" data-volume="0.7"></audio>
      <audio id="this4" class="clip" src="assets/audio/this4.wav" data-start="39.29" data-duration="1.24" data-media-start="0.00" data-track-index="1" data-volume="1"></audio>
      <audio id="closing4" class="clip" src="assets/audio/closing.wav" data-start="41.29" data-duration="0.99" data-media-start="0.00" data-track-index="1" data-volume="1"></audio>
      <audio id="closechime4" class="clip" src="assets/audio/closechime.wav" data-start="42.29" data-duration="1.70" data-media-start="0.00" data-track-index="2" data-volume="0.7"></audio>
      <audio id="prechime5" class="clip" src="assets/audio/prechime.wav" data-start="46.60" data-duration="2.20" data-media-start="0.00" data-track-index="2" data-volume="0.8"></audio>
      <audio id="next5" class="clip" src="assets/audio/next5.wav" data-start="48.30" data-duration="8.18" data-media-start="0.00" data-track-index="1" data-volume="1"></audio>
      <!-- audio:end -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
    <script>
      // The scene takes a moment to build (and the minimap image to decode):
      // tell the renderer to wait for it before asking for frames.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.cab = new Promise((resolve) => { window.__cabReady = resolve; });
    </script>
    <script type="module">
      import * as THREE from "./assets/vendor/three.module.js";
      import city from "./assets/city-wide.js";   // the wider city, for the closing shot (assets/city.js is the first, smaller one)
      import geo from "./assets/minimap-geo.js";
      import captions from "./assets/captions.js";
      import { createCabRide } from "./assets/cab-ride.js";
      import { GLTFLoader } from "./assets/vendor/addons/GLTFLoader.js";
      import { clone } from "./assets/vendor/addons/SkeletonUtils.js";
      import art from "./assets/art.js";
      const img = new Image();
      img.src = "assets/minimap.png";
      await img.decode();
      // The ride is drawn from timeline time alone (the hf-seek protocol).
      // the campaign's logos for the end credits (from buildthetunnelchicago.org)
      const logo = async (src) => { const i = new Image(); i.src = src; await i.decode(); return i; };
      const logos = { crosstowner: await logo("assets/logos/crosstowner.png"), starline: await logo("assets/logos/starline-chicago.png") };
      // the people: Quaternius's Universal Base Characters (CC0, assets/people), dressed and posed in cab-ride.js
      const gltf = new GLTFLoader(), tex = new THREE.TextureLoader();
      const skinTex = async (file) => { const t = await tex.loadAsync("assets/people/bodies/" + file); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; return t; };
      const HAIR = ["Hair_Buzzed", "Hair_SimpleParted", "Hair_Long", "Hair_Buns", "Hair_BuzzedFemale", "Hair_Beard"];
      const USE_HUMANS = false;                                   // off for now: too slow to render (see cab-ride.js, `humans`)
      const [male, female, maleSkin, femaleSkin, ...hairs] = !USE_HUMANS ? [] : await Promise.all([
        gltf.loadAsync("assets/people/bodies/Superhero_Male_FullBody.gltf"), gltf.loadAsync("assets/people/bodies/Superhero_Female_FullBody.gltf"),
        skinTex("T_Superhero_Male_Ligh.png"), skinTex("T_Superhero_Female_Light_BaseColor.png"),
        ...HAIR.map((h) => gltf.loadAsync(`assets/people/hair/${h}.gltf`))]);
      const humans = { male, female, skin: { male: maleSkin, female: femaleSkin }, hair: Object.fromEntries(HAIR.map((h, i) => [h, hairs[i]])), clone };
      // the Art Institute of Chicago's paintings for the station walls (public domain)
      const artwork = await Promise.all(art.map(async (a) => { const i = new Image(); i.src = a.file; await i.decode(); return { ...a, img: i }; }));
      // ?size=WxH draws the film at another frame size without changing this file (tools/direct-render.mjs --size)
      const [W, H] = (new URLSearchParams(location.search).get("size") || "1080x1920").split("x").map(Number);
      const ride = createCabRide(THREE, city, document.getElementById("cab"), W, H, { img, geo }, logos, captions, USE_HUMANS ? humans : null, artwork);
      window.__cabRide = ride;
      window.addEventListener("hf-seek", (e) => ride.render(e.detail.time));
      ride.render(0);
      window.__cabReady();
    </script>
  </body>
</html>
