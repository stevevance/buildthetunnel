# Publish the website to GitHub Pages.
#
# Only the files listed under "Assemble the public site" are published. The
# rest of the repo (CLAUDE.md, README.md, analysis/, docs/, newsletter/,
# worker/, ...) stays in the repo but is not served at tunnel.stevevance.net.
# To publish a new top-level file or folder, add it to that list.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the public site
        run: |
          mkdir _site
          cp -R \
            index.html popular.html ohareaccess.html signup.html analysis.html videos.html \
            flythrough planner maps img cabride \
            lines.js favicon.svg apple-touch-icon.png \
            sitemap.xml robots.txt CNAME \
            _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
